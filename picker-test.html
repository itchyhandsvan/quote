<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Photo picker test</title>
  <style>
    body { font: 16px -apple-system, system-ui, sans-serif; margin: 0; padding: 16px; background: #f4f2ef; color: #111; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    p { color: #6b6b6b; font-size: 14px; margin: 0 0 16px; }
    .test { background: #fff; border-radius: 14px; padding: 14px; margin-bottom: 12px; }
    .test b { display: block; margin-bottom: 8px; }
    .pick { display: inline-block; background: #111; color: #fff; border-radius: 10px; padding: 10px 16px; font-weight: 600; }
    .out { margin-top: 8px; font-size: 14px; color: #6b6b6b; }
    .out.ok { color: #14532d; font-weight: 600; }
  </style>
</head>
<body>
  <h1>Photo picker test</h1>
  <p>Try each test with the same photo from Photo Library. Each one either shows ✓ with the photo's details or gets stuck. Photos stay on your phone; nothing is uploaded.</p>
  <div id="tests"></div>
  <script>
    // Different ways of asking iOS for a photo, to find one the Photo Library doesn't stall on.
    const TESTS = [
      { id: "A", label: "A · images (how v33 worked)", attrs: { accept: "image/*" } },
      { id: "B", label: "B · images + HEIC (how v35 works)", attrs: { accept: "image/*,image/heic,image/heif" } },
      { id: "C", label: "C · no file type", attrs: {} },
      { id: "D", label: "D · JPEG and PNG only", attrs: { accept: "image/jpeg,image/png" } },
      { id: "E", label: "E · images, allow several", attrs: { accept: "image/*", multiple: "" } },
      { id: "F", label: "F · plain button (no label)", attrs: { accept: "image/*" }, plain: true },
    ];
    const root = document.getElementById("tests");
    for (const t of TESTS) {
      const box = document.createElement("div");
      box.className = "test";
      const out = Object.assign(document.createElement("div"), { className: "out", textContent: "Not tried yet" });
      const input = document.createElement("input");
      input.type = "file";
      for (const [k, v] of Object.entries(t.attrs)) input.setAttribute(k, v);
      let started = 0;
      input.onchange = () => {
        const f = input.files[0];
        const secs = ((performance.now() - started) / 1000).toFixed(1);
        out.className = "out" + (f ? " ok" : "");
        out.textContent = f
          ? `✓ Got it after ${secs}s: ${f.name} · ${f.type || "unknown type"} · ${(f.size / 1e6).toFixed(1)} MB`
          : "Cancelled";
        input.value = "";
      };
      if (t.plain) {
        // Input kept in the page but invisible; a normal button opens it.
        input.style.cssText = "position:absolute;width:1px;height:1px;opacity:0;";
        const btn = Object.assign(document.createElement("button"), { type: "button", className: "pick", textContent: "Pick photo" });
        btn.style.border = "0";
        btn.onclick = () => { started = performance.now(); out.className = "out"; out.textContent = "Waiting for the photo…"; input.click(); };
        box.append(Object.assign(document.createElement("b"), { textContent: t.label }), btn, input, out);
      } else {
        const label = Object.assign(document.createElement("label"), { className: "pick", textContent: "Pick photo" });
        input.hidden = true;
        label.onclick = () => { started = performance.now(); out.className = "out"; out.textContent = "Waiting for the photo…"; };
        label.append(input);
        box.append(Object.assign(document.createElement("b"), { textContent: t.label }), label, out);
      }
      root.append(box);
    }
  </script>
</body>
</html>
